# The API Worker (docs/design.md §10, §14). Secrets (SUPABASE_SERVICE_ROLE_KEY, STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET, STAFF_TOKEN) are set with `wrangler secret put`, never written here;
# locally they live in the git-ignored .dev.vars (copy .dev.vars.example).
name = "slot-order-api"
main = "src/index.ts"
compatibility_date = "2026-11-06"
workers_dev = true
preview_urls = false

[observability]
enabled = true

# Every minute: release expired holds, then expire their Stripe sessions (§8.3).
[triggers]
crons = ["* * * * *"]

# Production values. `wrangler dev` overrides them with apps/api/.dev.vars (SUPABASE_URL of the local
# stack, WEB_ORIGIN = http://localhost:3000 for the local web app). WEB_ORIGIN is the web Worker (§11.3):
# CORS, and Stripe's success and cancel URLs (§9.1).
[vars]
WEB_ORIGIN = "https://slot-order-web.antonsplavnik.workers.dev"
SUPABASE_URL = "https://ckvngajrwdijdtjvfblm.supabase.co"
