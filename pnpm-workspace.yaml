packages:
  - packages/*
  - apps/*

allowBuilds:
  esbuild: true
  workerd: true

catalog:
  typescript: 7.0.2
  vitest: 5.1.0
  zod: 4.6.7
  "@types/node": 26.6.5

# pnpm 11 holds back packages released less than a day ago; these two were pinned on purpose (M0).
minimumReleaseAgeExclude:
  - miniflare@5.20261104.0-beta
  - wrangler@4.158.0
