# The checks on every push to main and every pull request (docs/design.md §14); the deploy jobs
# arrive in M4 (API, migrations) and M6 (web). Actions are pinned to a release's commit, its tag
# beside it. A change to Markdown or docs/ alone runs nothing.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm test
      # The slot rules must not depend on the host's timezone (docs/design.md §6.3): the core suite once more
      # with the process in Berlin time.
      - run: pnpm --filter @slot-order/core test:berlin

  # The database suite (docs/design.md §13 Database, §14): the local Supabase stack on the runner, only
  # Postgres, PostgREST and the gateway (measured in M0: about 1.5 minutes including the image pulls),
  # then `pnpm test:db`, which resets it from the migrations and seed and runs the 50-parallel test.
  test-db:
    name: Database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres, PostgREST and the gateway
        run: supabase start -x studio,imgproxy,inbucket,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api
      - run: pnpm test:db

  # On main, once both check jobs pass: the migrations to the cloud project (migrations only; the seed was
  # applied once by hand, docs/design.md §14), then the API Worker. The web app's deploy arrives in M6.
  deploy:
    name: Deploy
    needs: [checks, test-db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0
      - run: pnpm install --frozen-lockfile
      - name: Migrations to the cloud project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" -p "$SUPABASE_DB_PASSWORD" --yes
          supabase db push --remote -p "$SUPABASE_DB_PASSWORD" --yes
      - name: Deploy the API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @slot-order/api exec wrangler deploy
